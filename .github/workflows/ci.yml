name: CI

on:
  push:
    branches: [master]
  pull_request:

# Read-only: this workflow builds and tests, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pinned to the exact 1.42.3 binary release for reproducible CI.
      - name: Install just
        run: |
          curl -fsSL https://github.com/casey/just/releases/download/1.42.3/just-1.42.3-x86_64-unknown-linux-musl.tar.gz -o just.tar.gz
          tar -xzf just.tar.gz just
          sudo install just /usr/local/bin/just

      - run: npm run build

      # `npm test` compiles again before running the unit suites; the second
      # compile is harmless, so the script stays the single source of truth.
      # `npm run test:e2e` is deliberately absent: it drives a real Sonic Pi 5
      # daemon over OSC and GitHub-hosted runners have no Sonic Pi installed.
      # Lint gate: zero findings required (honest fixes only - no suppressions in repo).
      - name: Lint (eslint + prettier, fail-fast)
        run: just lint

      - run: just test-unit

      # Artifact-level gate (kept out of test:unit on purpose: it packages the real vsix
      # through the registry), so CI keeps proving the artifact loads its own module graph.
      - run: node test/vsix-smoke.test.js
