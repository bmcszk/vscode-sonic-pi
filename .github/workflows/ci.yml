name: CI

on:
  push:
    branches: [master]
  pull_request:

# Read-only: this workflow builds and tests, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # `npm test` compiles again before running the unit suites; the second
      # compile is harmless, so the script stays the single source of truth.
      # `npm run test:e2e` is deliberately absent: it drives a real Sonic Pi 5
      # daemon over OSC and GitHub-hosted runners have no Sonic Pi installed.
      - run: npm test
