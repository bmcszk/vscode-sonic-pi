name: Release

on:
  push:
    tags: ['v*']

# Read-only by default; the publish jobs get scoped write access.
permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Same suites as CI. `npm run test:e2e` is excluded because it needs a
      # real Sonic Pi 5 daemon, which GitHub-hosted runners do not have.
      - run: npm test

  # GitHub release (VSIX asset) — write scope contained to this job
  publish-github:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package VSIX
        id: package
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          npx --yes @vscode/vsce@4.1.0 package --out "sonic-pi-5-extension-${version}.vsix"
          echo "path=sonic-pi-5-extension-${version}.vsix" >> "$GITHUB_OUTPUT"

      # gh CLI instead of a third-party release action: one less pinned
      # dependency, and gh is preinstalled on GitHub-hosted runners.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${GITHUB_REF_NAME}" "${{ steps.package.outputs.path }}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes

  # Marketplace publish (OIDC) — id-token scope, no PAT
  publish-marketplace:
    name: Publish to Marketplace (Trusted Publishing)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Package
        run: npx --yes @vscode/vsce@4.1.0 package --out sonic-pi-5-extension-${{ github.ref_name }}.vsix

      - name: Publish to Marketplace (OIDC)
        env:
          VSCE_PAT: ""
        run: npx --yes @vscode/vsce@4.1.0 publish --no-dependency -p "$VSCE_PAT" sonic-pi-5-extension-${{ github.ref_name }}.vsix