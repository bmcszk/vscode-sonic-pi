name: Release

on:
  push:
    tags: ['v*']

# Read-only by default; the publish job below is the single place that gets
# write access.
permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # Same suites as CI. `npm run test:e2e` is excluded because it needs a
      # real Sonic Pi 5 daemon, which GitHub-hosted runners do not have.
      - run: npm test

  # Publishing lives in its own job because it is the only step that needs
  # `contents: write`. A separate job keeps the test steps on a read-only
  # token and scopes the write grant to just creating the release.
  publish:
    name: Create GitHub release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      # The tag must name the version being shipped: package.json is the source
      # of the VSIX filename, so a tag/version mismatch would publish a release
      # whose asset name contradicts its tag. Fail before packaging instead.
      - name: Package VSIX
        id: package
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi
          npx --yes @vscode/vsce@4.1.0 package --out "sonic-pi-5-extension-${version}.vsix"
          echo "path=sonic-pi-5-extension-${version}.vsix" >> "$GITHUB_OUTPUT"

      # gh CLI instead of a third-party release action: one less pinned
      # dependency, and gh is preinstalled on GitHub-hosted runners.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "${GITHUB_REF_NAME}" "${{ steps.package.outputs.path }}"
          --title "${GITHUB_REF_NAME}"
          --generate-notes